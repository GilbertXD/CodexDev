[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-dev"
version = "1.0.0"
description = "Antigravity x Codex CLI automated development workflow orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-dev = "codex_dev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_dev = ["schemas/*.json"]
